spring.application.name=hld-with-ui
server.port=${PORT:${BACKEND_PORT:${SERVER_PORT:8080}}}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never

# HTTP safeguards, independent of virtual-time/model budgets.
hld.http.max-request-bytes=${HLD_MAX_REQUEST_BYTES:262144}
hld.http.max-simulation-response-bytes=${HLD_MAX_SIMULATION_RESPONSE_BYTES:4194304}
hld.http.max-concurrent-simulations=${HLD_MAX_CONCURRENT_SIMULATIONS:2}
spring.jackson.deserialization.fail-on-trailing-tokens=true
